# stolen from https://kotlinlang.org/docs/multiplatform/github-actions-for-kmp.html#create-a-composite-action-for-gradle-setup

name: gradle-setup
description: Setup Java and Gradle
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4.0.0
      with:
        java-version: "17"
        distribution: "temurin"
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5.0.0